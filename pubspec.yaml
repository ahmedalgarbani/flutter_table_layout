name: flutter_table_layout
description: Responsive data table for Flutter with frozen columns, sorting, filtering, grouping, editing, and Excel/PDF export for mobile, web, and desktop.
version: 0.1.0
homepage: https://github.com/ahmedalgarbani/flutter_table_layout
repository: https://github.com/ahmedalgarbani/flutter_table_layout
issue_tracker: https://github.com/ahmedalgarbani/flutter_table_layout/issues
topics:
  - table
  - datatable
  - data-grid
  - responsive
  - export

screenshots:
  - description: Desktop data grid with search, date filter, summary and pagination.
    path: doc/screenshots/desktop_light.png
  - description: Mobile card layout (Arabic / RTL).
    path: doc/screenshots/mobile_rtl.png
  - description: Frozen columns and per-column filters.
    path: doc/screenshots/grid_frozen.png
  - description: Row grouping and inline cell editing.
    path: doc/screenshots/grid_grouping_editing.png

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  excel: ^4.0.6
  flutter_bloc: ">=8.1.6 <10.0.0"
  intl: ">=0.19.0 <0.22.0"
  path_provider: ^2.1.3
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ">=11.0.0 <14.0.0"
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
